name: binavex-ci
on:
  push:
  pull_request:
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            config: Debug
            os: ubuntu-latest
          - compiler: gcc
            config: Release
            os: ubuntu-latest
          - compiler: clang
            config: Debug
            os: ubuntu-latest
          - compiler: clang
            config: Release
            os: ubuntu-latest
          - compiler: msvc
            config: Debug
            os: windows-latest
          - compiler: msvc
            config: Release
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict C99
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "msvc" ]; then
            cmake -S . -B build -DBINAVEX_BUILD_TESTS=ON -DBINAVEX_STRICT_WARNINGS=ON
          else
            cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBINAVEX_BUILD_TESTS=ON -DBINAVEX_STRICT_WARNINGS=ON
          fi
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        shell: bash
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ${{ matrix.sanitizer }} sanitizer
        run: >-
          cmake -S . -B build -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug
          -DBINAVEX_BUILD_TESTS=ON -DBINAVEX_STRICT_WARNINGS=ON
          -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
